services:
  - type: web
    name: market-regime-api
    runtime: python
    region: oregon
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python -m uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: FRED_API_KEY
        sync: false          # Set this manually in Render dashboard
      - key: PYTHON_VERSION
        value: "3.11.0"
